### AI Automations

Seven workflows confirmed across the call. Four were the core "fairy automation" wishes, three more got added in conversation.

1. [ ] **Kitchen table follow-up sequence.** Trigger: in-person appointment marked complete in Job Nimbus. Behavior: monitors stage. If no contract signed and the customer said "wait 3 months," fire reminder at month 1 ("just checking in") and month 5 ("you said now, ready to talk?"). Brandon: "It's the follow-up. We don't have good follow-up, and that's the only way we're going to become 100 percent retail."
2. [ ] **Insurance claim filing guide.** Trigger: lead tagged as insurance claim. Behavior: step-by-step framework (what to tell the carrier, FAQs like "what type of damage was it caused by"), file-claim reminders, time-sensitivity warnings. Chris's pitch: "Most customers say 'I'll do it tomorrow,' then never call. Automate the follow-up so the lead doesn't leak."
3. [ ] **Gated review system.** Trigger: job marked paid plus closed in Job Nimbus. Behavior: branded portal. 3 stars or less routes to internal resolution (Brandon owns). 4 to 5 stars redirects to Google. Brandon raised the Amy F. case (1 star over A/R follow-ups) as the legitimate edge case the gate exists for.
4. [ ] **Weather alert monitoring.** Replaces Hail Recon (currently $3,000/year, "sometimes works, sometimes doesn't"). Monitor National Weather Service for catastrophic events (hail, wind, microbursts). Ping the team via SMS. Committed on the call to build this as a Surge product offered to middle-tier clients.
5. [ ] **Speed-to-lead AI SMS for surge events.** Brandon's microburst story: 30 calls in one hour. AI sends "we're slammed, calling back in 10 minutes" SMS to leads in the queue while Danielle and Work Ninjas work through them.
6. [ ] **Automated review request post-job.** Currently fires once on payment with no follow-up. Add a follow-up sequence to feed the gated review system above.
7. [ ] **Retail financing application follow-up.** Chris added in the call. Trigger: soft-pool approved but final application not submitted. Behavior: reminder to complete the final.

For every automation: research delivery (GHL versus custom), author flows, wire triggers on Job Nimbus and GHL status changes, validate speed-to-lead under 5 minutes, end-to-end QA.

<script>
  const links = document.querySelectorAll('.nav-link[data-tab]');
  const content = document.getElementById('content');
  const progress = document.getElementById('progress');
  const progressCount = document.getElementById('progressCount');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');
  const STORAGE_KEY_PREFIX = 'hs-roadmap-task-';
  const TAB_RE = /<!--\s*TAB:([^\s|]+)\s*\|\s*([^-]+?)\s*-->/g;

  let currentTab = null;

  function splitTabs(md) {
    TAB_RE.lastIndex = 0;
    if (!TAB_RE.test(md)) return null;
    TAB_RE.lastIndex = 0;
    const parts = md.split(TAB_RE);
    const preamble = parts[0];
    const tabs = [];
    for (let i = 1; i < parts.length; i += 3) {
      tabs.push({ id: parts[i].trim(), label: parts[i + 1].trim(), md: parts[i + 2] });
    }
    return { preamble, tabs };
  }

  function bindCheckboxes(root) {
    const checkboxes = root.querySelectorAll('input[type="checkbox"]');
    const tabId = root.dataset.tabId || 'root';
    checkboxes.forEach((cb, i) => {
      cb.disabled = false;
      const key = STORAGE_KEY_PREFIX + tabId + '-' + i;
      if (localStorage.getItem(key) === 'true') cb.checked = true;
      cb.addEventListener('change', () => {
        localStorage.setItem(key, cb.checked);
        updateProgress();
      });
    });
  }

  function activateTab(id) {
    const panels = content.querySelectorAll('.tab-panel');
    const buttons = content.querySelectorAll('.tab-button');
    let matched = false;
    panels.forEach(p => {
      const on = p.dataset.tabId === id;
      p.classList.toggle('active', on);
      if (on) matched = true;
    });
    if (!matched && panels.length) {
      panels[0].classList.add('active');
      id = panels[0].dataset.tabId;
    }
    buttons.forEach(b => b.classList.toggle('active', b.dataset.tabId === id));
    links.forEach(l => l.classList.toggle('active', l.dataset.tab === id));
    currentTab = id;
    updateProgress();
    if (history.replaceState) {
      const url = new URL(location.href);
      url.hash = id;
      history.replaceState({}, '', url);
    }
  }

  function updateProgress() {
    const scope = content.querySelector('.tab-panel.active') || content;
    const checkboxes = scope.querySelectorAll('input[type="checkbox"]');
    if (checkboxes.length === 0) {
      progress.style.display = 'none';
      return;
    }
    progress.style.display = 'flex';
    const total = checkboxes.length;
    const done = [...checkboxes].filter(c => c.checked).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    progressCount.textContent = done + ' / ' + total;
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  function render() {
    const md = document.getElementById('md-source').textContent;
    const split = splitTabs(md);
    content.innerHTML = '';

    if (!split) {
      content.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      bindCheckboxes(content);
      updateProgress();
      return;
    }

    if (split.preamble.trim()) {
      const pre = document.createElement('div');
      pre.innerHTML = marked.parse(split.preamble, { gfm: true, breaks: false });
      content.appendChild(pre);
    }
    const nav = document.createElement('div');
    nav.className = 'tab-nav';
    split.tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tab-button';
      btn.dataset.tabId = t.id;
      btn.textContent = t.label;
      btn.addEventListener('click', () => activateTab(t.id));
      nav.appendChild(btn);
    });
    content.appendChild(nav);
    split.tabs.forEach(t => {
      const panel = document.createElement('div');
      panel.className = 'tab-panel';
      panel.dataset.tabId = t.id;
      panel.innerHTML = marked.parse(t.md, { gfm: true, breaks: false });
      bindCheckboxes(panel);
      content.appendChild(panel);
    });

    const initial = location.hash.replace('#', '');
    const target = split.tabs.some(t => t.id === initial) ? initial : split.tabs[0].id;
    activateTab(target);
  }

  links.forEach(l => l.addEventListener('click', e => {
    e.preventDefault();
    activateTab(l.dataset.tab);
  }));

  render();
</script>
